<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04070e">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>QXNET 管理后台</title>
<style>
  *,*::before,*::after{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root{
    --bg-0:#04070e; --bg-1:#0a1020;
    --ink:#eef3fa; --sub:#9dabc2; --faint:#64728b;
    --line:rgba(255,255,255,.10);
    --line-strong:rgba(255,255,255,.16);
    --acc:#22d3ee; --acc-2:#0ea5e9; --acc-ink:#03171d;
    --acc-soft:rgba(34,211,238,.14);
    --danger:#f87171;
    --ok:#34d399; --warn:#fbbf24; --info:#60a5fa;
    --r-lg:22px; --r-md:16px; --r-sm:12px;
    --glass:rgba(255,255,255,.055);
    --glass-hi:rgba(255,255,255,.085);
    --ease:cubic-bezier(.22,1,.36,1);
    color-scheme:dark;
  }
  html,body{ min-height:100%; }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
    color:var(--ink); background:var(--bg-0); min-height:100vh;
    padding-bottom:calc(40px + env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased; letter-spacing:.1px;
    overflow-x:hidden;
  }
  /* 氛围底：深空 + 极低频光晕 */
  .aurora{ position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
  .aurora::before{
    content:""; position:absolute; inset:-20% -10% 0;
    background:
      radial-gradient(46% 38% at 78% -6%, rgba(34,211,238,.18), transparent 62%),
      radial-gradient(44% 40% at 12% 8%, rgba(14,165,233,.15), transparent 64%),
      radial-gradient(58% 46% at 50% 104%, rgba(34,211,238,.13), transparent 68%),
      linear-gradient(180deg,#060a14 0%, #0a1020 38%, #090f1d 72%, #070c17 100%);
  }
  .aurora::after{
    content:""; position:absolute; inset:0;
    background-image:radial-gradient(rgba(255,255,255,.05) 1px, transparent 1px);
    background-size:26px 26px; opacity:.5;
    mask-image:radial-gradient(circle at 50% 22%, #000 0%, transparent 72%);
    -webkit-mask-image:radial-gradient(circle at 50% 22%, #000 0%, transparent 72%);
  }
  .wrap{ max-width:1140px; margin:0 auto; padding:0 18px; position:relative; z-index:1; }

  /* ===== 通用玻璃 ===== */
  .glass{
    background:linear-gradient(158deg,var(--glass-hi),rgba(255,255,255,.022));
    backdrop-filter:blur(26px) saturate(180%) brightness(1.06);
    -webkit-backdrop-filter:blur(26px) saturate(180%) brightness(1.06);
    border:1px solid var(--line);
    box-shadow:0 24px 60px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.10), inset 0 -1px 0 rgba(0,0,0,.25);
  }

  /* ===== 按钮 ===== */
  .btn{
    appearance:none; border:1px solid var(--line); border-radius:var(--r-sm);
    padding:10px 16px; font-size:13.5px; font-weight:600; font-family:inherit;
    color:var(--sub); background:rgba(255,255,255,.05); cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    transition:transform .22s var(--ease), background .22s var(--ease), border-color .22s var(--ease), box-shadow .22s var(--ease), color .22s var(--ease);
    -webkit-tap-highlight-color:transparent; white-space:nowrap;
  }
  .btn:hover{ background:rgba(255,255,255,.09); color:var(--ink); border-color:var(--line-strong); }
  .btn:active{ transform:scale(.968); }
  .btn-primary{
    background:linear-gradient(135deg,var(--acc) 0%,var(--acc-2) 100%);
    color:var(--acc-ink); border-color:transparent;
    box-shadow:0 10px 26px rgba(34,211,238,.22), inset 0 1px 0 rgba(255,255,255,.42);
    letter-spacing:.6px;
  }
  .btn-primary:hover{ color:var(--acc-ink); filter:brightness(1.06); box-shadow:0 14px 34px rgba(34,211,238,.30), inset 0 1px 0 rgba(255,255,255,.5); }
  .btn-ghost{ background:rgba(255,255,255,.055); color:#c9d5e6; }
  .btn-danger{
    background:rgba(248,113,113,.10); color:#fda4a4;
    border-color:rgba(248,113,113,.26); box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
  }
  .btn-danger:hover{ background:rgba(248,113,113,.18); color:#fecaca; border-color:rgba(248,113,113,.4); }
  .btn-sm{ padding:7px 12px; font-size:12.5px; border-radius:10px; letter-spacing:.2px; }

  /* ===== 顶栏 ===== */
  .topbar{
    position:sticky; top:0; z-index:60;
    background:linear-gradient(180deg,rgba(6,10,20,.82),rgba(6,10,20,.52));
    backdrop-filter:blur(24px) saturate(170%);
    -webkit-backdrop-filter:blur(24px) saturate(170%);
    border-bottom:1px solid rgba(255,255,255,.075);
  }
  .topbar-inner{
    max-width:1140px; margin:0 auto; padding:14px 18px;
    padding-top:calc(14px + env(safe-area-inset-top));
    display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  .brand{ display:flex; align-items:center; gap:11px; font-weight:700; font-size:16px; letter-spacing:.3px; min-width:0; }
  .brand .logo{
    width:36px; height:36px; flex:0 0 36px; border-radius:11px; color:var(--acc-ink); font-weight:900; font-size:16px;
    background:linear-gradient(140deg,#5eead4 0%,#22d3ee 46%,#0ea5e9 100%);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 20px rgba(34,211,238,.30), inset 0 1px 0 rgba(255,255,255,.55);
  }
  .brand-txt{ display:flex; flex-direction:column; line-height:1.15; min-width:0; }
  .brand-txt b{ font-size:15.5px; font-weight:700; letter-spacing:.4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .brand-txt span{ font-size:9.5px; font-weight:600; color:var(--faint); letter-spacing:2.4px; margin-top:3px; }
  .top-actions{ display:flex; align-items:center; gap:9px; flex:0 0 auto; }
  .admin-chip{
    display:inline-flex; align-items:center; gap:7px; padding:6px 12px; border-radius:999px;
    background:rgba(255,255,255,.05); border:1px solid var(--line);
    font-size:12px; color:var(--sub); max-width:150px;
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  }
  .admin-chip .dot{ width:6px; height:6px; border-radius:50%; background:var(--ok); box-shadow:0 0 0 3px rgba(52,211,153,.16), 0 0 10px rgba(52,211,153,.6); flex:0 0 6px; }
  .admin-chip span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* ===== 区块标题 ===== */
  .hero{ padding:30px 4px 20px; animation:rise .7s var(--ease) both; }
  .hero-eyebrow{
    display:inline-flex; align-items:center; gap:7px; font-size:10.5px; font-weight:700; letter-spacing:2.6px;
    color:#67e8f9; text-transform:uppercase; margin-bottom:12px;
  }
  .hero-eyebrow::before{ content:""; width:18px; height:1px; background:linear-gradient(90deg,var(--acc),transparent); }
  .hero h2{ font-size:29px; font-weight:700; letter-spacing:-.4px; line-height:1.15; }
  .hero p{ margin-top:9px; font-size:13px; color:var(--faint); letter-spacing:.1px; }

  /* ===== 分段控件 ===== */
  .tabs{
    display:flex; gap:3px; padding:4px; border-radius:16px; margin-bottom:18px;
    background:linear-gradient(158deg,rgba(255,255,255,.07),rgba(255,255,255,.025));
    border:1px solid var(--line);
    backdrop-filter:blur(22px) saturate(180%); -webkit-backdrop-filter:blur(22px) saturate(180%);
    box-shadow:0 14px 34px rgba(0,0,0,.34), inset 0 1px 0 rgba(255,255,255,.10);
  }
  .tab{
    flex:1; text-align:center; padding:10px 12px; border-radius:13px; cursor:pointer;
    font-size:13px; font-weight:600; color:var(--sub);
    border:1px solid transparent;
    transition:all .26s var(--ease);
  }
  .tab:hover{ color:var(--ink); background:rgba(255,255,255,.05); }
  .tab.active{
    color:#a5f3fc; background:linear-gradient(150deg,rgba(34,211,238,.20),rgba(14,165,233,.10));
    border-color:rgba(34,211,238,.34);
    box-shadow:inset 0 0 16px rgba(34,211,238,.13), 0 6px 18px rgba(34,211,238,.12);
  }

  /* ===== 卡片 ===== */
  .card{
    background:linear-gradient(160deg,rgba(255,255,255,.062),rgba(255,255,255,.022)),rgba(10,16,29,.35);
    backdrop-filter:blur(28px) saturate(180%) brightness(1.05);
    -webkit-backdrop-filter:blur(28px) saturate(180%) brightness(1.05);
    border:1px solid var(--line); border-radius:var(--r-lg);
    padding:18px; position:relative; overflow:hidden;
    box-shadow:0 28px 70px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.09);
    animation:rise .5s var(--ease) both;
  }
  .card::after{ /* 顶部一道极细高光 */
    content:""; position:absolute; top:0; left:12%; right:12%; height:1px;
    background:linear-gradient(90deg,transparent,rgba(34,211,238,.45),transparent);
    opacity:.9;
  }
  .card-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:10px; padding:2px 2px 14px; }
  .card-head h3{ font-size:16px; font-weight:700; letter-spacing:-.1px; }
  .card-head p{ font-size:11.5px; color:var(--faint); margin-top:4px; }

  .toolbar{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:14px; }
  .toolbar input,.toolbar select{
    font-family:inherit; font-size:13px; color:var(--ink); outline:none;
    padding:10px 13px; border-radius:11px;
    background:rgba(255,255,255,.045); border:1px solid var(--line);
    transition:border-color .22s var(--ease), box-shadow .22s var(--ease), background .22s var(--ease);
  }
  .toolbar input::placeholder{ color:#5b6880; }
  .toolbar input:focus,.toolbar select:focus{
    border-color:rgba(34,211,238,.5); background:rgba(255,255,255,.075);
    box-shadow:0 0 0 3px rgba(34,211,238,.13), inset 0 1px 0 rgba(255,255,255,.08);
  }
  .toolbar input[type=number]{ max-width:112px; }
  .toolbar .grow{ flex:1 1 180px; min-width:0; }
  .toolbar select option{ background:#0a1020; color:var(--ink); }

  /* ===== 列表项 ===== */
  .list{ display:flex; flex-direction:column; gap:10px; }
  .item{
    position:relative; border-radius:var(--r-md); padding:16px 18px 16px 21px;
    background:radial-gradient(120% 100% at 0% 0%,rgba(56,189,248,.075),transparent 58%),linear-gradient(160deg,rgba(255,255,255,.058),rgba(255,255,255,.02)),rgba(13,21,36,.45);
    border:1px solid rgba(255,255,255,.075);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.055), 0 8px 22px rgba(0,0,0,.28);
    backdrop-filter:blur(14px) saturate(160%); -webkit-backdrop-filter:blur(14px) saturate(160%);
    transition:transform .24s var(--ease), border-color .24s var(--ease), box-shadow .24s var(--ease), background .24s var(--ease);
    animation:rise .42s var(--ease) both;
    overflow:hidden;
  }
  .item::before{ /* 左侧状态竖条：默认青，按状态色由内部徽章无法联动，此处统一为品牌青低饱和 */
    content:""; position:absolute; left:0; top:14px; bottom:14px; width:2.5px; border-radius:3px;
    background:linear-gradient(180deg,var(--acc),rgba(14,165,233,.25));
    opacity:.65;
  }
  .item:hover{ transform:translateY(-2px); border-color:rgba(255,255,255,.13); box-shadow:inset 0 1px 0 rgba(255,255,255,.07), 0 14px 34px rgba(0,0,0,.38); background:radial-gradient(120% 100% at 0% 0%,rgba(56,189,248,.10),transparent 58%),linear-gradient(160deg,rgba(255,255,255,.075),rgba(255,255,255,.028)),rgba(16,26,44,.5); }
  .item-top{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:11px; }
  .item-title{ font-weight:650; font-size:14px; letter-spacing:.1px; color:var(--ink); word-break:break-all; min-width:0; line-height:1.35; }
  .item-side{ display:flex; align-items:center; gap:6px; flex-shrink:0; flex-wrap:wrap; justify-content:flex-end; }
  .item-grid{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px 18px; margin:0 0 15px; grid-auto-rows:min-content; }
  .kv{ display:flex; flex-direction:column; gap:3px; min-width:0; }
  .kv .k{ font-size:10.5px; color:#7b8ba6; letter-spacing:.7px; text-transform:uppercase; font-weight:600; }
  .kv .v{ font-size:13px; color:#d9e4f2; word-break:break-word; overflow-wrap:anywhere; line-height:1.5; }
  .item-actions{ display:flex; gap:8px; flex-wrap:wrap; }
  .mono{ font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12.5px; letter-spacing:.1px; }

  /* 列表入场错峰 */
  .item:nth-child(1){ animation-delay:.01s } .item:nth-child(2){ animation-delay:.04s }
  .item:nth-child(3){ animation-delay:.07s } .item:nth-child(4){ animation-delay:.10s }
  .item:nth-child(5){ animation-delay:.13s } .item:nth-child(6){ animation-delay:.16s }
  .item:nth-child(n+7){ animation-delay:.18s }

  /* ===== 徽章 ===== */
  .badge{
    display:inline-flex; align-items:center; gap:5px; padding:4px 9px 4px 8px; border-radius:999px;
    font-size:10.5px; font-weight:650; letter-spacing:.4px; white-space:nowrap;
    border:1px solid transparent;
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  }
  .badge::before{ content:""; width:5px; height:5px; border-radius:50%; background:currentColor; box-shadow:0 0 8px currentColor; }
  .b-active{ color:#6ee7b7; background:rgba(52,211,153,.12); border-color:rgba(52,211,153,.26); }
  .b-expired{ color:#fcd34d; background:rgba(251,191,36,.12); border-color:rgba(251,191,36,.26); }
  .b-banned{ color:#fca5a5; background:rgba(248,113,113,.12); border-color:rgba(248,113,113,.28); }
  .b-used{ color:#94a3b8; background:rgba(148,163,184,.12); border-color:rgba(148,163,184,.24); }
  .b-free{ color:#7dd3fc; background:rgba(96,165,250,.12); border-color:rgba(96,165,250,.26); }
  .b-type{ color:#a5f3fc; background:rgba(34,211,238,.12); border-color:rgba(34,211,238,.28); }

  .sk{ border-radius:var(--r-md); padding:16px 18px; margin-bottom:10px;
    background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.02)),rgba(13,21,36,.4);
    border:1px solid rgba(255,255,255,.07); overflow:hidden; position:relative; }
  .sk::after{ content:""; position:absolute; inset:0; transform:translateX(-100%);
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.07),transparent);
    animation:shimmer 1.3s infinite; }
  .sk-line{ height:11px; border-radius:6px; background:rgba(255,255,255,.09); margin:9px 0; }
  .sk-line.w40{ width:40% } .sk-line.w60{ width:60% } .sk-line.w90{ width:88% }
  .btn:disabled{ opacity:.6; cursor:default; transform:none; }
  .muted{ color:var(--faint); font-size:12px; }
  .empty{ text-align:center; color:var(--faint); padding:44px 0; font-size:13px; letter-spacing:.3px; }

  /* ===== 复制按钮 ===== */
  .copy-btn{
    display:inline-flex; align-items:center; gap:5px; font-family:inherit;
    padding:7px 11px; border-radius:10px; font-size:12.5px; font-weight:600; cursor:pointer;
    color:#7dd3fc; background:rgba(34,211,238,.10); border:1px solid rgba(34,211,238,.24);
    transition:all .2s var(--ease);
  }
  .copy-btn:hover{ background:rgba(34,211,238,.18); border-color:rgba(34,211,238,.4); }
  .copy-btn:active{ transform:scale(.95); }
  .copy-btn svg{ width:12px; height:12px; }

  /* ===== 登录 ===== */
  #loginView{ min-height:100vh; min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:24px 20px; position:relative; z-index:1; }
  .login-box{
    width:100%; max-width:392px; position:relative; border-radius:28px; padding:38px 28px 24px;
    background:linear-gradient(158deg,rgba(255,255,255,.085),rgba(255,255,255,.028));
    backdrop-filter:blur(38px) saturate(190%) brightness(1.06);
    -webkit-backdrop-filter:blur(38px) saturate(190%) brightness(1.06);
    border:1px solid rgba(255,255,255,.13);
    box-shadow:0 40px 90px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.16);
    animation:loginIn .7s var(--ease) both;
    overflow:hidden;
  }
  .login-box::before{ content:""; position:absolute; top:-1px; left:20%; right:20%; height:1px;
    background:linear-gradient(90deg,transparent,rgba(34,211,238,.6),transparent); }
  .login-brand{ display:flex; flex-direction:column; align-items:center; text-align:center; margin-bottom:28px; }
  .login-box .logo-big{
    width:62px; height:62px; border-radius:19px; color:var(--acc-ink); font-weight:900; font-size:27px;
    background:linear-gradient(140deg,#5eead4,#22d3ee 50%,#0ea5e9);
    display:flex; align-items:center; justify-content:center; position:relative;
    box-shadow:0 16px 38px rgba(34,211,238,.32), inset 0 1px 0 rgba(255,255,255,.6);
    animation:logoBreath 4.2s ease-in-out infinite;
  }
  .login-box .logo-big::after{ content:""; position:absolute; inset:-16px; border-radius:30px; z-index:-1;
    background:radial-gradient(circle,rgba(34,211,238,.28),transparent 68%); filter:blur(12px); }
  .login-brand h1{ font-size:21px; font-weight:700; letter-spacing:.4px; margin:18px 0 6px; }
  .login-brand p{ font-size:10px; letter-spacing:3.2px; font-weight:600; color:var(--faint); text-transform:uppercase; }
  .login-field{ position:relative; margin-bottom:12px; }
  .login-field .lf-icon{ position:absolute; left:15px; top:50%; transform:translateY(-50%); width:17px; height:17px; color:#5f6c85; display:flex; pointer-events:none; transition:color .22s var(--ease); }
  .login-field input{
    width:100%; padding:14px 44px 14px 44px; font-family:inherit; font-size:14.5px; color:var(--ink); outline:none;
    border-radius:14px; border:1px solid var(--line);
    background:rgba(255,255,255,.045);
    transition:border-color .22s var(--ease), box-shadow .22s var(--ease), background .22s var(--ease);
  }
  .login-field input::placeholder{ color:#5b6880; }
  .login-field input:focus{
    border-color:rgba(34,211,238,.5); background:rgba(255,255,255,.075);
    box-shadow:0 0 0 3px rgba(34,211,238,.13), inset 0 1px 0 rgba(255,255,255,.08);
  }
  .login-field input:focus ~ .lf-icon{ color:var(--acc); }
  .lf-toggle{ position:absolute; right:8px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer;
    color:#5f6c85; padding:8px; display:flex; border-radius:9px; transition:color .2s var(--ease), background .2s var(--ease); }
  .lf-toggle:hover{ color:var(--sub); background:rgba(255,255,255,.05); }
  .lf-toggle svg{ width:17px; height:17px; }
  .login-submit{ width:100%; margin-top:12px; padding:14px; border-radius:14px; font-size:15px; font-weight:700; letter-spacing:4px; }
  .login-foot{ margin-top:20px; display:flex; align-items:center; justify-content:center; gap:6px; color:var(--faint); font-size:11px; letter-spacing:.2px; }
  .login-foot svg{ width:13px; height:13px; color:rgba(34,211,238,.7); }

  /* ===== 表单 ===== */
  .field{ margin-bottom:15px; }
  .field label{ display:block; font-size:11px; color:var(--faint); margin-bottom:7px; font-weight:600; letter-spacing:.5px; text-transform:uppercase; }
  .field input,.field select{
    width:100%; padding:12px 14px; border-radius:12px; font-family:inherit; font-size:14px; color:var(--ink); outline:none;
    background:rgba(255,255,255,.045); border:1px solid var(--line);
    transition:border-color .22s var(--ease), box-shadow .22s var(--ease), background .22s var(--ease);
  }
  .field input::placeholder{ color:#5b6880; }
  .field input:focus,.field select:focus{ border-color:rgba(34,211,238,.5); background:rgba(255,255,255,.075); box-shadow:0 0 0 3px rgba(34,211,238,.13); }
  .field select option{ background:#0a1020; color:var(--ink); }
  .field .mono{ color:#a5f3fc; font-size:13px; padding:7px 0 3px; }

  /* ===== 弹窗 ===== */
  .modal-mask{
    position:fixed; inset:0; z-index:200; display:none; align-items:center; justify-content:center; padding:24px;
    background:rgba(2,5,12,.62);
    backdrop-filter:blur(14px) saturate(120%); -webkit-backdrop-filter:blur(14px) saturate(120%);
  }
  .modal-mask.show{ display:flex; animation:fade .24s var(--ease); }
  .modal{
    width:100%; max-width:356px; border-radius:22px; padding:24px 22px 20px;
    background:linear-gradient(158deg,rgba(255,255,255,.10),rgba(255,255,255,.035));
    backdrop-filter:blur(34px) saturate(190%) brightness(1.08); -webkit-backdrop-filter:blur(34px) saturate(190%) brightness(1.08);
    border:1px solid rgba(255,255,255,.15);
    box-shadow:0 34px 80px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.18);
    animation:pop .34s var(--ease) both;
  }

  /* ===== 窄屏适配：按钮不被挤、信息不重叠 ===== */
  @media (max-width:860px){
    .item-grid{ grid-template-columns:repeat(2,minmax(0,1fr)); }

  @media (max-width:600px){

    .item-grid .kv{ flex-direction:row; align-items:baseline; gap:8px; }
    .item-grid .kv .k{ width:56px; flex:0 0 56px; }

  /* ===== 动效 ===== */
  @keyframes shimmer{ 100%{ transform:translateX(100%); } }
  @keyframes rise{ from{ opacity:0; transform:translateY(14px); } to{ opacity:1; transform:translateY(0); } }
  @keyframes fade{ from{ opacity:0 } to{ opacity:1 } }
  @keyframes pop{ from{ opacity:0; transform:scale(.93) translateY(10px); } to{ opacity:1; transform:scale(1) translateY(0); } }
  @keyframes loginIn{ from{ opacity:0; transform:translateY(20px) scale(.97); } to{ opacity:1; transform:translateY(0) scale(1); } }
  @keyframes logoBreath{ 0%,100%{ transform:translateY(0) scale(1); box-shadow:0 16px 38px rgba(34,211,238,.30), inset 0 1px 0 rgba(255,255,255,.6); } 50%{ transform:translateY(-5px) scale(1.02); box-shadow:0 22px 48px rgba(34,211,238,.42), inset 0 1px 0 rgba(255,255,255,.6); } }
  @media (prefers-reduced-motion:reduce){ *{ animation-duration:.001ms !important; transition-duration:.001ms !important; } }

  ::-webkit-scrollbar{ width:7px; height:7px; }
  ::-webkit-scrollbar-track{ background:transparent; }

<script>
const $ = id => document.getElementById(id);
let currentTab = 'users';
let resetTarget = null;
let banTarget = null;

const BASE = 'https://gngcducutevgllbaejec.supabase.co/functions/v1/admin-api';

// 会话三源冗余：localStorage 主 + localStorage 备份 + cookie，降低被单源清理导致掉线的概率
function setCookie(name, val, days) {
  try { const d = new Date(Date.now() + days * 86400000).toUTCString(); document.cookie = `${name}=${encodeURIComponent(val)}; expires=${d}; path=/; SameSite=Lax`; } catch (e) {}
}
function getCookie(name) {
  const m = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
  return m ? decodeURIComponent(m[1]) : '';
}
function clearCookie(name) { try { document.cookie = `${name}=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/`; } catch (e) {} }
function readToken() {
  try { return localStorage.getItem('admin_token') || localStorage.getItem('admin_token_backup') || getCookie('admin_token') || ''; }
  catch (e) { return getCookie('admin_token') || ''; }
}
function saveToken(t) {
  token = t || '';
  try { localStorage.setItem('admin_token', token); localStorage.setItem('admin_token_backup', token); } catch (e) {}
  if (token) setCookie('admin_token', token, 3650); else clearCookie('admin_token');
}
function clearToken() {
  token = '';
  try { localStorage.removeItem('admin_token'); localStorage.removeItem('admin_token_backup'); } catch (e) {}
  clearCookie('admin_token');
}
let token = readToken();

async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
  if (token) headers['Authorization'] = 'Bearer ' + token;
  const method = (opts.method || 'GET').toUpperCase();
  let url = BASE + path;
  if (method === 'GET') url += (url.includes('?') ? '&' : '?') + '_t=' + Date.now();
  const res = await fetch(url, { ...opts, headers, cache: 'no-store' });
  if (res.status === 401) {
    clearToken();
    showLogin(); throw new Error('未登录');
  }
  return res.json();
}

function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._tm); t._tm = setTimeout(() => t.classList.remove('show'), 2000);
}

// ===== 登录 / 登出 =====
function showLogin() {
  $('loginView').classList.remove('hidden');
  $('mainView').classList.add('hidden');
}
function showMain() {
  $('loginView').classList.add('hidden');
  $('mainView').classList.remove('hidden');
  if (!usersCache) { $('userBody').innerHTML = skeletonRows(3); $('userEmpty').classList.add('hidden'); }
  bootstrapAll();
}
async function bootstrapAll() {
  try {
    const j = await api('/bootstrap');
    if (j.code !== 0) { loadUsers(true); return; }
    const d = j.data || {};
    if (Array.isArray(d.users)) { usersCache = d.users; usersAt = Date.now(); if (currentTab === 'users') renderUsers(usersCache); }
    if (Array.isArray(d.cards)) { cardsCache = d.cards; cardsAt = Date.now(); if (currentTab === 'cards') renderCards(cardsCache); }
    if (Array.isArray(d.records)) {
      recordsCache.messages = d.records; recordsAt.messages = Date.now();
      if (currentTab === 'records' && $('recordType').value === 'messages') renderRecords(d.records, RECORD_COLS.messages);
    }
  } catch (e) { loadUsers(true); }
}

$('loginBtn').onclick = async () => {
  const user = $('loginUser').value.trim(), pass = $('loginPass').value;
  if (!user || !pass) return toast('请输入账号和密码');
  const j = await api('/login', { method: 'POST', body: JSON.stringify({ user, password: pass }) });
  if (j.code === 0) {
    token = j.data.token; saveToken(j.data.token);
    $('adminName').textContent = user; showMain();
  }
  else toast(j.msg || '登录失败');
};
$('loginPass').addEventListener('keydown', e => { if (e.key === 'Enter') $('loginBtn').click(); });
$('passToggle').onclick = () => {
  const p = $('loginPass');
  const show = p.type === 'password';
  p.type = show ? 'text' : 'password';
  const svg = $('passToggle').querySelector('svg');
  svg.innerHTML = show
    ? '<path d="M12 7c5 0 9.2 3.1 11 7a12.6 12.6 0 01-2.2 3.1l-1.5-1.5A10.6 10.6 0 0012 13a4 4 0 01-4-4c0-.4.06-.8.16-1.18L6.7 6.34A12.5 12.5 0 001 14c1.8 3.9 6 7 11 7 2.1 0 4.1-.6 5.8-1.6L20 21.6 18.6 23l-15-15L5 6.6 12 7zm.4 4.4L14.6 13a2 2 0 00-2.2-1.6z"/>'
    : '<path d="M12 5c-5 0-9.2 3.1-11 7 1.8 3.9 6 7 11 7s9.2-3.1 11-7c-1.8-3.9-6-7-11-7zm0 11a4 4 0 110-8 4 4 0 010 8zm0-6a2 2 0 100 4 2 2 0 000-4z"/>';
};

$('logoutBtn').onclick = async () => {
  await api('/logout', { method: 'POST' });
  clearToken();
  showLogin();
};

// ===== Tab 切换 =====
document.querySelectorAll('.tab').forEach(t => {
  t.onclick = () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    currentTab = t.dataset.tab;
    ['users', 'cards', 'records'].forEach(k => $('tab-' + k).classList.toggle('hidden', k !== currentTab));
    if (currentTab === 'cards') loadCards();
    if (currentTab === 'records') loadRecords();
  };
});

// ===== 用户 =====
const STATUS = { active:['b-active','正常'], expired:['b-expired','已过期'], banned:['b-banned','已封禁'], unlicensed:['b-free','未授权'] };
const TYPE_CN = { day:'天卡', week:'周卡', month:'月卡', quarter:'季卡', lifetime:'永久' };

let usersCache = null, usersAt = 0;
function skeletonRows(n) {
  return Array.from({ length: n }, () => '<div class="sk"><div class="sk-line w60"></div><div class="sk-line w90"></div><div class="sk-line w40"></div></div>').join('');
}
function renderUsers(list) {
  $('userBody').innerHTML = '';
  $('userEmpty').classList.toggle('hidden', list.length > 0);
  list.forEach(u => {
    const [cls, txt] = STATUS[u.status] || STATUS.active;
    const el = document.createElement('div');
    el.className = 'item';
    el.innerHTML = `
      <div class="item-top">
        <div class="item-title mono">${esc(u.email)}</div>
        <span class="badge ${cls}">${txt}</span>
      </div>
      <div class="item-grid">
        <div class="kv"><span class="k">授权到期</span><span class="v">${u.expires_at ? esc(u.expires_at.slice(0,10)) : '-'}</span></div>
        <div class="kv"><span class="k">卡密</span><span class="v mono">${u.card_key ? esc(u.card_key) : '-'}</span></div>
        <div class="kv"><span class="k">设备号</span><span class="v mono">${u.device_id ? esc(u.device_id) : '-'}</span></div>
        <div class="kv"><span class="k">注册时间</span><span class="v">${esc(fmtTime(u.created_at))}</span></div>
        <div class="kv"><span class="k">最后登录</span><span class="v">${esc(fmtTime(u.last_sign_in_at))}</span></div>
      </div>
      <div class="item-actions">
        <button class="btn btn-ghost btn-sm" data-act="reset" data-id="${u.id}" data-email="${esc(u.email)}">重置密码</button>
        ${u.device_id ? `<button class="btn btn-ghost btn-sm" data-act="unbind" data-id="${u.id}" data-email="${esc(u.email)}">解绑设备</button>` : ''}
        <button class="btn btn-ghost btn-sm" data-act="ban" data-id="${u.id}" data-email="${esc(u.email)}" data-ban="${u.status==='banned'?0:1}">${u.status==='banned'?'解封':'封禁'}</button>
        <button class="btn btn-danger btn-sm" data-act="del" data-id="${u.id}">删除</button>
      </div>`;
    $('userBody').appendChild(el);
  });
}

async function loadUsers(force) {
  const q = $('userSearch').value.trim();
  const btn = $('refreshUsers');
  if (!q && !force && usersCache && Date.now() - usersAt < 20000) { renderUsers(usersCache); return; }
  if (!q) {
    if (usersCache) renderUsers(usersCache);
    else { $('userBody').innerHTML = skeletonRows(3); $('userEmpty').classList.add('hidden'); }
  }
  if (btn) { btn.dataset.label = btn.dataset.label || btn.textContent; btn.disabled = true; btn.textContent = '刷新中'; }
  try {
    const j = await api('/users' + (q ? '?search=' + encodeURIComponent(q) : ''));
    if (j.code !== 0) { $('userBody').innerHTML = ''; return toast(j.msg); }
    const list = j.data || [];
    if (!q) { usersCache = list; usersAt = Date.now(); }
    renderUsers(list);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = btn.dataset.label || '刷新'; }
  }
}

$('userBody').addEventListener('click', async e => {
  const btn = e.target.closest('button'); if (!btn) return;
  const { act, id, email, ban } = btn.dataset;
  if (act === 'reset') {
    resetTarget = id; $('resetEmail').textContent = email; $('resetPwd').value = '';
    $('resetModal').classList.add('show');
  } else if (act === 'unbind') {
    if (!confirm(`确认解绑 ${email} 绑定的设备？解绑后可在新设备登录。`)) return;
    const j = await api('/users/' + id + '/unbind-device', { method: 'POST' });
    toast(j.msg); if (j.code === 0) loadUsers();
  } else if (act === 'ban') {
    if (ban === '0') {
      const j = await api('/users/' + id + '/ban', { method: 'POST', body: JSON.stringify({ ban: false }) });
      toast(j.msg); if (j.code === 0) loadUsers();
    } else {
      banTarget = id; $('banEmail').textContent = email; $('banHours').value = '';
      $('banModal').classList.add('show');
    }
  } else if (act === 'del') {
    if (!confirm('确认删除该用户？此操作不可恢复')) return;
    const j = await api('/users/' + id, { method: 'DELETE' });
    toast(j.msg); if (j.code === 0) loadUsers();
  }
});

$('resetCancel').onclick = () => $('resetModal').classList.remove('show');
$('resetConfirm').onclick = async () => {
  const pwd = $('resetPwd').value;
  if (pwd.length < 8) return toast('新密码需 8 位及以上');
  const j = await api('/users/' + resetTarget + '/reset-password', { method: 'POST', body: JSON.stringify({ password: pwd }) });
  toast(j.msg);
  if (j.code === 0) $('resetModal').classList.remove('show');
};

$('banCancel').onclick = () => $('banModal').classList.remove('show');
$('banConfirm').onclick = async () => {
  const custom = $('banHours').value.trim();
  const duration = custom !== '' ? custom : $('banPreset').value;
  const j = await api('/users/' + banTarget + '/ban', { method: 'POST', body: JSON.stringify({ ban: true, duration }) });
  toast(j.msg);
  if (j.code === 0) $('banModal').classList.remove('show');
  loadUsers();
};

$('refreshUsers').onclick = () => loadUsers(true);
$('userSearch').addEventListener('keydown', e => { if (e.key === 'Enter') loadUsers(); });

// ===== 卡密 =====
let cardsCache = null, cardsAt = 0;
function renderCards(list) {
  $('cardBody').innerHTML = '';
  $('cardEmpty').classList.toggle('hidden', list.length > 0);
  list.forEach(c => {
    const el = document.createElement('div');
    el.className = 'item';
    el.innerHTML = `
      <div class="item-top">
        <div class="item-title mono">${esc(c.card_key)}</div>
        <div class="item-side">
          <span class="badge b-type">${TYPE_CN[c.type] || c.type}</span>
          <span class="badge ${c.used ? 'b-used' : 'b-active'}">${c.used ? '已使用' : '未使用'}</span>
        </div>
      </div>
      <div class="item-grid">
        <div class="kv"><span class="k">类型</span><span class="v">${TYPE_CN[c.type] || c.type}</span></div>
        <div class="kv"><span class="k">创建时间</span><span class="v">${esc(fmtTime(c.created_at))}</span></div>
        <div class="kv"><span class="k">使用账号</span><span class="v mono">${c.used ? (c.bound_email ? esc(c.bound_email) : '-') : '-'}</span></div>
        <div class="kv"><span class="k">到期时间</span><span class="v">${c.used && c.expires_at ? esc(fmtTime(c.expires_at)) : '-'}</span></div>
      </div>
      <div class="item-actions">
        <button class="copy-btn" data-key="${esc(c.card_key)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>复制</button>
        <button class="btn btn-danger btn-sm" data-id="${c.id}" data-used="${c.used ? 1 : 0}">${c.used ? '吊销' : '作废'}</button>
        <button class="btn btn-danger btn-sm" data-act="del-card" data-id="${c.id}">删除</button>
      </div>`;
    $('cardBody').appendChild(el);
  });
}
async function loadCards(force) {
  if (!force && cardsCache && Date.now() - cardsAt < 20000) { renderCards(cardsCache); return; }
  if (!cardsCache) { $('cardBody').innerHTML = skeletonRows(3); $('cardEmpty').classList.add('hidden'); }
  const j = await api('/cards');
  if (j.code !== 0) { $('cardBody').innerHTML = ''; return toast(j.msg); }
  const list = j.data || [];
  cardsCache = list; cardsAt = Date.now();
  renderCards(list);
}

$('cardBody').addEventListener('click', async e => {
  const btn = e.target.closest('button'); if (!btn) return;
  if (btn.classList.contains('copy-btn')) { copyText(btn.dataset.key); return; }
  if (btn.dataset.act === 'del-card') {
    if (!confirm('确认删除该卡密？此操作不可恢复。')) return;
    const j = await api('/cards/' + btn.dataset.id, { method: 'DELETE' });
    toast(j.msg); if (j.code === 0) loadCards();
    return;
  }
  const used = btn.dataset.used === '1';
  const tip = used ? '确认吊销该卡密？将同时封禁使用它注册的账号，此操作不可恢复。' : '确认作废该卡密？';
  if (!confirm(tip)) return;
  const j = await api('/cards/' + btn.dataset.id + '/revoke', { method: 'POST' });
  toast(j.msg); if (j.code === 0) loadCards();
});

$('genCards').onclick = async () => {
  const type = $('cardType').value;
  const count = parseInt($('cardCount').value, 10) || 10;
  const j = await api('/cards/batch', { method: 'POST', body: JSON.stringify({ type, count }) });
  toast(j.msg);
  if (j.code === 0) {
    const box = $('genResult');
    box.classList.remove('hidden');
    box.innerHTML = (j.data || []).map(c => `<div class="code">${esc(c)}</div>`).join('');
    loadCards();
  }
};
$('refreshCards').onclick = () => loadCards(true);

$('customCardBtn').onclick = () => { $('customKey').value = ''; $('customModal').classList.add('show'); };
$('customCancel').onclick = () => $('customModal').classList.remove('show');
$('customConfirm').onclick = async () => {
  const card_key = $('customKey').value.trim();
  const type = $('customType').value;
  if (!card_key) return toast('请输入卡密');
  const j = await api('/cards/custom', { method: 'POST', body: JSON.stringify({ card_key, type }) });
  toast(j.msg);
  if (j.code === 0) { $('customModal').classList.remove('show'); loadCards(); }
};

// ===== 记录 =====
const RECORD_COLS = {
  messages: ['content', 'contact', 'device_id', 'created_at'],
  chat_messages: ['content', 'user_id', 'created_at'],
  visits: ['device_id', 'visited_at'],
  login_log: ['ip', 'last_user', 'fail_count', 'locked_until', 'last_success_at', 'last_fail_at']
};
const RECORD_LABEL = { content:'内容', contact:'联系方式', device_id:'设备号', created_at:'时间', user_id:'用户', visited_at:'访问时间', ip:'IP', last_user:'账号', fail_count:'失败次数', locked_until:'锁定至', last_success_at:'最近成功', last_fail_at:'最近失败' };
const recordsCache = {};
const recordsAt = {};
function renderRecords(list, cols) {
  $('recordBody').innerHTML = '';
  $('recordEmpty').classList.toggle('hidden', list.length > 0);
  list.forEach(r => {
    const el = document.createElement('div');
    el.className = 'item';
    el.innerHTML = `<div class="item-grid">${cols.map(c => {
      let v = r[c] != null ? esc(String(r[c])) : '-';
      if (['created_at', 'visited_at', 'locked_until', 'last_success_at', 'last_fail_at'].includes(c)) v = r[c] ? esc(fmtTime(r[c])) : '-';
      return `<div class="kv"><span class="k">${RECORD_LABEL[c] || c}</span><span class="v mono">${v}</span></div>`;
    }).join('')}</div>`;
    $('recordBody').appendChild(el);
  });
}
async function loadRecords(force) {
  const type = $('recordType').value;
  if (!force && recordsCache[type] && Date.now() - (recordsAt[type] || 0) < 20000) { renderRecords(recordsCache[type], RECORD_COLS[type]); return; }
  if (!recordsCache[type]) { $('recordBody').innerHTML = skeletonRows(3); $('recordEmpty').classList.add('hidden'); }
  const j = type === 'login_log' ? await api('/login-log') : await api('/records?type=' + type);
  if (j.code !== 0) { $('recordBody').innerHTML = ''; return toast(j.msg); }
  const list = j.data || [];
  recordsCache[type] = list; recordsAt[type] = Date.now();
  renderRecords(list, RECORD_COLS[type]);
}
$('refreshRecords').onclick = () => loadRecords(true);
$('recordType').onchange = loadRecords;

function copyText(t) {
  const done = () => toast('已复制：' + t);
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t).then(done).catch(() => fallbackCopy(t, done));
  } else fallbackCopy(t, done);
}
function fallbackCopy(t, done) {
  const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch (_) { toast('复制失败，请手动复制'); }
  ta.remove();
}

function fmtTime(iso) {
  if (!iso) return '-';
  const d = new Date(String(iso));
  if (isNaN(d.getTime())) return String(iso);
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

// 启动：校验现有会话
(async () => {
  try {
    const j = await api('/me');
    if (j.code === 0) { $('adminName').textContent = j.data.user; showMain(); }
  } catch (e) { showLogin(); }
})();
</script>
